<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>Arcade — two-player mini games</title>
    <meta
      name="description"
      content="Four two-player mini games. Share a four-letter code, play in under two minutes."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <!-- iOS ignores the manifest for the home-screen icon and uses this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Arcade" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <script>
      // Theme and accent are both applied before first paint, so the page never
      // flashes the wrong mode or the default colour before the saved one.
      // Kept in sync with src/lib/accent.tsx.
      ;(function () {
        var root = document.documentElement
        var theme = 'dark'
        try {
          var storedTheme = sessionStorage.getItem('arcade.theme')
          theme = storedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        } catch (e) {}
        root.dataset.theme = theme

        var accents = {
          mono: { dark: ['#f4f2ed', '#0b0b0c'], light: ['#17150f', '#ffffff'] },
          vermillion: { dark: ['#ff4a2b', '#0b0b0c'], light: ['#de3009', '#ffffff'] },
          amber: { dark: ['#ffb020', '#0b0b0c'], light: ['#a35c00', '#ffffff'] },
          lime: { dark: ['#c9f231', '#0b0b0c'], light: ['#5c7300', '#ffffff'] },
          teal: { dark: ['#2dd4bf', '#0b0b0c'], light: ['#0c7a6c', '#ffffff'] },
          azure: { dark: ['#5c9bff', '#0b0b0c'], light: ['#1155d6', '#ffffff'] },
          magenta: { dark: ['#ff5fa8', '#0b0b0c'], light: ['#c1006a', '#ffffff'] }
        }
        try {
          // Falls back to mono, the default, so a first visit does not flash the
          // stylesheet's colour before React mounts and corrects it.
          var pair = accents[localStorage.getItem('arcade.accent')] || accents.mono
          if (pair) {
            root.style.setProperty('--t-accent', pair[theme][0])
            root.style.setProperty('--t-accent-ink', pair[theme][1])
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
