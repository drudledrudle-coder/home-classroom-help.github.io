[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# The app's two server endpoints. Both must come before the SPA fallback.
[[redirects]]
  from = "/api/room"
  to = "/.netlify/functions/room"
  status = 200
  force = true

[[redirects]]
  from = "/api/gate"
  to = "/.netlify/functions/gate"
  status = 200
  force = true

[[redirects]]
  from = "/api/scores"
  to = "/.netlify/functions/scores"
  status = 200
  force = true

# SPA fallback. Must come after the API redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# The service worker must never be served from a cache. It is the thing that
# decides what every other file's cache lifetime is, so a stale copy pins the
# whole app to an old build with no way to ship a fix.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Same reasoning: the shell names the hashed assets, so a cached copy would keep
# pointing at the previous build's files.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
