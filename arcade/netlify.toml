[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# The app's two server endpoints. Both must come before the SPA fallback.
[[redirects]]
  from = "/api/room"
  to = "/.netlify/functions/room"
  status = 200
  force = true

[[redirects]]
  from = "/api/gate"
  to = "/.netlify/functions/gate"
  status = 200
  force = true

# SPA fallback. Must come after the API redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
